<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fetcher</title></head>
<body>
  <div id="out">pending</div>
  <script>
    fetch('/data.json')
      .then(r => r.json())
      .then(j => { document.getElementById('out').textContent = JSON.stringify(j); })
      .catch(e => { document.getElementById('out').textContent = 'ERR ' + e; });
  </script>
</body></html>
