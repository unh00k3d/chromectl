<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Login fixture</title></head>
<body>
  <h1>Sign in</h1>
  <form id="login" onsubmit="event.preventDefault();document.getElementById('who').textContent=document.getElementById('user').value;">
    <input id="user" name="user" type="text" placeholder="username">
    <input id="pass" name="pass" type="password" placeholder="password">
    <button id="submit" type="submit">Sign in</button>
  </form>
  <div id="who"></div>
</body></html>
