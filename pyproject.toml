[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chromectl"
version = "0.3.0"
description = "A friendly CLI for driving Chrome over the DevTools Protocol — for agents and humans."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "unh00k3d" }]
keywords = ["chrome", "chromium", "cdp", "devtools", "automation", "agent", "cli", "playwright", "lighthouse", "headless"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = [
    "websocket-client>=1.7",
    "rich>=13",
    "playwright>=1.40",
    "readability-lxml>=0.8",
    "markdownify>=0.11",
    "lxml_html_clean>=0.1",
]

[project.optional-dependencies]
# `lighthouse` command also needs the Node CLI:  npm i -g lighthouse
dev = ["build", "twine", "pipx", "pytest>=7"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/unh00k3d/chromectl"
Repository = "https://github.com/unh00k3d/chromectl"
Issues = "https://github.com/unh00k3d/chromectl/issues"

[project.scripts]
chromectl = "chromectl.cli:main"

[tool.setuptools]
packages = ["chromectl"]

[tool.setuptools.package-data]
chromectl = ["protocol.json", "SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the browser-driven tests start and stop their own headless Chrome; they skip
# cleanly when no Chrome is on PATH, so a bare `pytest` is always safe to run
addopts = "-q"
