[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chromectl"
version = "0.1.0"
description = "A friendly CLI for driving Chrome over the DevTools Protocol — for agents and humans."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "chromectl" }]
keywords = ["chrome", "cdp", "devtools", "automation", "agent", "cli", "playwright"]
dependencies = [
    "websocket-client>=1.7",
    "rich>=13",
    "playwright>=1.40",
    "readability-lxml>=0.8",
    "markdownify>=0.11",
    "lxml_html_clean>=0.1",
]

[project.optional-dependencies]
# `lighthouse` command also needs the Node CLI:  npm i -g lighthouse
dev = ["build", "pipx"]

[project.scripts]
chromectl = "chromectl.cli:main"

[tool.setuptools]
packages = ["chromectl"]

[tool.setuptools.package-data]
chromectl = ["protocol.json"]
